<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coopafasb - Eventos</title>
    <link rel="icon" type="image/png" href="../../imgs/logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">Coopafasb</div>
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="navbar-nav" id="navMenu">
                <a href="../Conheça/index.html" class="nav-link">Conheça</a>
                <a href="../Historia/index.html" class="nav-link">História</a>
                <a href="../Eventos/index.html" class="nav-link active">Eventos</a>
                <a href="../Produtos/index.html" class="nav-link">Produtos</a>
                <a href="../Contato/index.html" class="nav-link">Contato</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="events-section" aria-labelledby="events-title">
            <h1 id="events-title">Eventos</h1>

            <div class="event-carousel" id="eventCarousel" tabindex="0">
                <div class="event-slides">
                    <article class="event-slide active">
                        <img src="../../imgs/Coopafasb.jpg" alt="Evento da Coopafasb">
                        <div class="event-slide-caption">
                            <span>01</span>
                            <h2>Encontros que fortalecem a cooperação</h2>
                        </div>
                    </article>
                    <article class="event-slide">
                        <img src="../../imgs/La no Quintal.jpg" alt="Evento no campo">
                        <div class="event-slide-caption">
                            <span>02</span>
                            <h2>Cooperação no campo</h2>
                        </div>
                    </article>
                    <article class="event-slide">
                        <img src="../../imgs/logo.png" alt="Eventos Coopafasb">
                        <div class="event-slide-caption">
                            <span>03</span>
                            <h2>Participação e desenvolvimento</h2>
                        </div>
                    </article>
                    <article class="event-slide">
                        <img src="../../imgs/Coopafasb.jpg" alt="Atividade da Coopafasb">
                        <div class="event-slide-caption">
                            <span>04</span>
                            <h2>Atividades da cooperativa</h2>
                        </div>
                    </article>
                    <article class="event-slide">
                        <img src="../../imgs/La no Quintal.jpg" alt="Encontro da agricultura familiar">
                        <div class="event-slide-caption">
                            <span>05</span>
                            <h2>Momentos para compartilhar</h2>
                        </div>
                    </article>
                </div>

                <button class="event-carousel-button event-carousel-button-prev" type="button" aria-label="Imagem anterior">&#10094;</button>
                <button class="event-carousel-button event-carousel-button-next" type="button" aria-label="Próxima imagem">&#10095;</button>

                <div class="event-carousel-indicators" aria-label="Selecionar imagem">
                    <button class="event-carousel-indicator active" type="button" aria-label="Mostrar imagem 1" aria-current="true"></button>
                    <button class="event-carousel-indicator" type="button" aria-label="Mostrar imagem 2"></button>
                    <button class="event-carousel-indicator" type="button" aria-label="Mostrar imagem 3"></button>
                    <button class="event-carousel-indicator" type="button" aria-label="Mostrar imagem 4"></button>
                    <button class="event-carousel-indicator" type="button" aria-label="Mostrar imagem 5"></button>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; <span id="year"></span> Coopafasb - Todos os direitos reservados</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
