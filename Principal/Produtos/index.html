<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coopafasb - Produtos</title>
    <link rel="icon" type="image/png" href="../../imgs/logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">Coopafasb</div>
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="navbar-nav" id="navMenu">
                <a href="../Conheça/index.html" class="nav-link">Conheça</a>
                <a href="../Historia/index.html" class="nav-link">História</a>
                <a href="../Eventos/index.html" class="nav-link">Eventos</a>
                <a href="../Produtos/index.html" class="nav-link active">Produtos</a>
                <a href="../Contato/index.html" class="nav-link">Contato</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="products-section" aria-labelledby="products-title">
            <h1 id="products-title">Produtos</h1>

            <div class="product-carousel" id="productCarousel" tabindex="0">
                <div class="product-slides">
                    <article class="product-slide active">
                        <img src="../../imgs/Coopafasb.jpg" alt="Produto da Coopafasb">
                        <div class="product-slide-caption">
                            <span>01</span>
                            <h2>Produtos da agricultura familiar</h2>
                        </div>
                    </article>
                    <article class="product-slide">
                        <img src="../../imgs/La no Quintal.jpg" alt="Produto natural da Coopafasb">
                        <div class="product-slide-caption">
                            <span>02</span>
                            <h2>Qualidade que vem do campo</h2>
                        </div>
                    </article>
                    <article class="product-slide">
                        <img src="../../imgs/logo.png" alt="Produtos Coopafasb">
                        <div class="product-slide-caption">
                            <span>03</span>
                            <h2>Orgânicos de qualidade</h2>
                        </div>
                    </article>
                    <article class="product-slide">
                        <img src="../../imgs/Coopafasb.jpg" alt="Produtos frescos da Coopafasb">
                        <div class="product-slide-caption">
                            <span>04</span>
                            <h2>Frescor em cada produto</h2>
                        </div>
                    </article>
                    <article class="product-slide">
                        <img src="../../imgs/La no Quintal.jpg" alt="Produção da agricultura familiar">
                        <div class="product-slide-caption">
                            <span>05</span>
                            <h2>Produção com cuidado</h2>
                        </div>
                    </article>
                </div>

                <button class="carousel-button carousel-button-prev" type="button" aria-label="Imagem anterior">&#10094;</button>
                <button class="carousel-button carousel-button-next" type="button" aria-label="Próxima imagem">&#10095;</button>

                <div class="carousel-indicators" aria-label="Selecionar imagem">
                    <button class="carousel-indicator active" type="button" aria-label="Mostrar imagem 1" aria-current="true"></button>
                    <button class="carousel-indicator" type="button" aria-label="Mostrar imagem 2"></button>
                    <button class="carousel-indicator" type="button" aria-label="Mostrar imagem 3"></button>
                    <button class="carousel-indicator" type="button" aria-label="Mostrar imagem 4"></button>
                    <button class="carousel-indicator" type="button" aria-label="Mostrar imagem 5"></button>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; <span id="year"></span> Coopafasb - Todos os direitos reservados</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
